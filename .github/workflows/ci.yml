name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + offline unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt ruff
      - name: Lint
        run: ruff check backend
      - name: Unit tests (in-memory SQLite, no Postgres / Redis / SSH needed)
        run: PYTHONPATH=backend pytest backend/tests/unit -q

  frontend:
    name: Frontend (lint, types, build, unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Component tests (Vitest, mocked API)
        run: npm run test:unit

  integration:
    name: Backend integration (Postgres + Redis + simulated SSH devices)
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Start database, broker and simulated devices
        run: docker compose up -d postgres redis sim_switch_classroom sim_switch_hostel sim_router_lab
      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            docker exec campus_drift_postgres pg_isready -U postgres && exit 0
            sleep 2
          done
          exit 1
      - name: Migrate and seed the database
        working-directory: backend
        run: |
          alembic upgrade head
          python ../database/seed/seed_data.py
      - name: Integration tests
        run: PYTHONPATH=backend pytest backend/tests/integration -q
      - if: always()
        run: docker compose down -v
