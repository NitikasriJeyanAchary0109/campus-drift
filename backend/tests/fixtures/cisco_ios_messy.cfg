! Messy Cisco IOS configuration fixture
! Features: irregular tabs, multiple spaces, mixed casing, out-of-order blocks and list items

   
version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
ntp server 10.10.0.1
!
VLAN 99
	name Management
!
vlan 20
   name Faculty
!
vlan 10
 name Students
!
Hostname sw-classroom-01
!
ip domain-name   campus.internal   
!
Interface FastEthernet0/1
  switchport access vlan 10
  switchport mode access
  switchport port-security violation restrict
  switchport port-security maximum 2
  switchport port-security
!
interface FastEthernet0/2
	switchport mode access
	switchport access vlan 10
	switchport port-security
!
interface GigabitEthernet0/1
  switchport mode trunk
  switchport trunk allowed vlan 99,10,20
!
interface Vlan99
  no shutdown
  ip address 10.10.1.10 255.255.255.0
!
ip default-gateway 10.10.1.1
!
snmp-server community internal-read RO
!
access-list 10 permit 10.10.2.0 0.0.0.255
access-list 10 permit 10.10.1.0 0.0.0.255
access-list 10 deny any
!
line vty 0 4
  exec-timeout 10 0
  transport input ssh
  login local
!
line con 0
  exec-timeout 5 0
!
end
