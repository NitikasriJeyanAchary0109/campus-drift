! Syntax Variant Cisco IOS configuration fixture
! Features: CIDR notation, no switchport, multiple NTP servers, syntax variations

version 15.4
service timestamps debug datetime msec
service timestamps log datetime msec
!
hostname sw-variant-01
!
ip domain-name campus.internal
!
vlan 10,20,30,40
!
interface GigabitEthernet0/0
 no switchport
 ip address 10.10.100.1/24
 no shutdown
!
interface GigabitEthernet0/1
 switchport mode trunk
 switchport trunk allowed vlan 10,30,20,40
!
interface FastEthernet0/1
 switchport mode access
 switchport access vlan 10
 switchport port-security
!
ntp server 10.10.0.2
ntp server 10.10.0.1
!
snmp-server community monitoring RO
snmp-server community public RO
!
ip access-list standard VTY-ACCESS
 permit 10.10.1.0 0.0.0.255
 permit 10.10.2.0 0.0.0.255
 deny any
!
line vty 0 4
 transport input telnet ssh
 login local
!
end
