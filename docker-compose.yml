services:
  postgres:
    image: postgres:16-alpine
    container_name: campus_drift_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-campus_drift}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: campus_drift_backend
    restart: unless-stopped
    volumes:
      - ./backend:/app
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-campus_drift}
      - SECRET_KEY=${SECRET_KEY:-supersecretkeycampusdriftchangeinproduction1234567890}
      - ALGORITHM=${ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DEBUG=${DEBUG:-True}
      - CORS_ORIGINS=["http://localhost:5173","http://127.0.0.1:5173","http://localhost:8000"]
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: campus_drift_frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend

  # Simulated Network Devices for Netmiko SSH Collection & Remediation
  sim_switch_classroom:
    build:
      context: .
      dockerfile: network/simulated_devices/Dockerfile
    container_name: sim_switch_classroom
    restart: unless-stopped
    environment:
      - DEVICE_HOSTNAME=sw-classroom-01
      - CONFIG_FILE=/etc/network/classroom_switch.cfg
    ports:
      - "2222:22"

  sim_switch_hostel:
    build:
      context: .
      dockerfile: network/simulated_devices/Dockerfile
    container_name: sim_switch_hostel
    restart: unless-stopped
    environment:
      - DEVICE_HOSTNAME=sw-hostel-01
      - CONFIG_FILE=/etc/network/hostel_switch.cfg
    ports:
      - "2223:22"

  sim_router_lab:
    build:
      context: .
      dockerfile: network/simulated_devices/Dockerfile
    container_name: sim_router_lab
    restart: unless-stopped
    environment:
      - DEVICE_HOSTNAME=rtr-lab-01
      - CONFIG_FILE=/etc/network/lab_router.cfg
    ports:
      - "2224:22"

volumes:
  postgres_data:
    driver: local
