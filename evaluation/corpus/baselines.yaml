- name: Classroom-Eval-Baseline
  device_group: Classroom
  vendor: cisco_ios
  criticality_weight: 1.0
  rules:
  - key_path: line.vty.transport_input
    expected_value: ssh
    rule_type: EXACT
    severity_weight: 90
    hard_compliance: true
    description: Cleartext Telnet must not be enabled on VTY lines; SSH is the only approved management transport.
  - key_path: snmp.community.public.exists
    expected_value: 'false'
    rule_type: MUST_NOT_EXIST
    severity_weight: 95
    hard_compliance: true
    description: The default 'public' SNMP community must not exist; it exposes device state to any host.
  - key_path: snmp.community.private.exists
    expected_value: 'false'
    rule_type: MUST_NOT_EXIST
    severity_weight: 95
    hard_compliance: true
    description: The default 'private' SNMP community must not exist; it commonly grants read-write access.
  - key_path: interface.FastEthernet0/1.port_security.enabled
    expected_value: 'true'
    rule_type: EXACT
    severity_weight: 70
    hard_compliance: false
    description: Port security must be enabled on edge ports to stop rogue switches and MAC flooding.
  - key_path: interface.FastEthernet0/2.port_security.enabled
    expected_value: 'true'
    rule_type: EXACT
    severity_weight: 70
    hard_compliance: false
    description: Port security must be enabled on edge ports to stop rogue switches and MAC flooding.
  - key_path: interface.FastEthernet0/3.port_security.enabled
    expected_value: 'true'
    rule_type: EXACT
    severity_weight: 70
    hard_compliance: false
    description: Port security must be enabled on edge ports to stop rogue switches and MAC flooding.
  - key_path: interface.FastEthernet0/4.port_security.enabled
    expected_value: 'true'
    rule_type: EXACT
    severity_weight: 70
    hard_compliance: false
    description: Port security must be enabled on edge ports to stop rogue switches and MAC flooding.
  - key_path: ntp.server
    expected_value: 10.10.0.1
    rule_type: EXACT
    severity_weight: 30
    hard_compliance: false
    description: Devices must sync time only from the institutional NTP server so logs can be correlated.
  - key_path: interface.GigabitEthernet0/1.switchport.trunk_allowed_vlans
    expected_value: 10,11,12,99
    rule_type: EXACT
    severity_weight: 85
    hard_compliance: false
    description: The uplink trunk may carry only the approved VLANs; extra VLANs leak traffic across segments.
  - key_path: interface.FastEthernet0/1.switchport.access_vlan
    expected_value: '10'
    rule_type: EXACT
    severity_weight: 85
    hard_compliance: false
    description: Edge ports must stay in their approved access VLAN and never join the management VLAN.
