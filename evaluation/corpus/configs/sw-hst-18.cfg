!
version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
hostname sw-hst-18
boot-start-marker
boot-end-marker
ip domain-name campus.internal
!
vlan 30
 name Hostel-Access
!
vlan 99
 name Management
!
interface FastEthernet0/1
 switchport mode access
 switchport access vlan 30
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation restrict
!
interface FastEthernet0/2
 switchport mode access
 switchport access vlan 30
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation restrict
!
interface FastEthernet0/3
 switchport mode access
 switchport access vlan 30
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation restrict
!
interface FastEthernet0/4
 switchport mode access
 switchport access vlan 30
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation restrict
!
interface FastEthernet0/5
 switchport mode access
 switchport access vlan 30
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation restrict
!
interface FastEthernet0/6
 switchport mode access
 switchport access vlan 30
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation restrict
!
interface FastEthernet0/7
 switchport mode access
 switchport access vlan 30
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation restrict
!
interface FastEthernet0/8
 switchport mode access
 switchport access vlan 30
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation restrict
!
interface GigabitEthernet0/1
 switchport mode trunk
 switchport trunk allowed vlan 30,31,99
!
interface Vlan99
 ip address 10.22.18.10 255.255.255.0
 no shutdown
!
ip default-gateway 10.22.18.1
ntp server 10.10.0.1
snmp-server community campus-ro RO
snmp-server community public RO
!
ip access-list extended STUDENT-IN
 permit ip 10.10.30.0 0.0.0.255 host 10.10.0.53
 permit ip 10.10.30.0 0.0.0.255 host 10.10.0.54
 deny ip 10.10.30.0 0.0.0.255 10.10.0.0 0.0.255.255
 permit ip 10.10.30.0 0.0.0.255 any
 deny ip any any
!
line con 0
 exec-timeout 5 0
!
line vty 0 4
 transport input ssh
 exec-timeout 15 0
 login local
!
end
