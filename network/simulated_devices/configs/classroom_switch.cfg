!
! Simulated Cisco IOS Configuration for Campus Switch
! Location: Classroom Core Switch (Building A, Floor 1)
!
version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname sw-classroom-01
!
boot-start-marker
boot-end-marker
!
enable secret 5 $1$mERr$hx5rVt7rPNoS4wqbXKX7m0
!
no aaa new-model
!
ip domain-name campus.internal
!
vlan 10
 name Students
!
vlan 20
 name Faculty
!
vlan 99
 name Management
!
interface FastEthernet0/1
 switchport mode access
 switchport access vlan 10
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation restrict
!
interface FastEthernet0/2
 switchport mode access
 switchport access vlan 10
 switchport port-security
!
interface GigabitEthernet0/1
 switchport mode trunk
 switchport trunk allowed vlan 10,20,99
!
interface Vlan99
 ip address 10.10.1.10 255.255.255.0
 no shutdown
!
ip default-gateway 10.10.1.1
!
ntp server 10.10.0.1
!
snmp-server community internal-read RO
!
line con 0
 exec-timeout 5 0
line vty 0 4
 transport input ssh
 exec-timeout 10 0
 login local
!
end
