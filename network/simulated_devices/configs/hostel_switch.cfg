!
! Simulated Cisco IOS Configuration for Campus Switch
! Location: Hostel Edge Switch (Block B)
! NOTE: Contains deliberate configuration drift for testing:
! - Insecure transport: telnet enabled alongside ssh on vty
! - Public SNMP community string
! - Missing port-security on FastEthernet0/1 through 0/8
!
version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname sw-hostel-01
!
boot-start-marker
boot-end-marker
!
ip domain-name campus.internal
!
vlan 30
 name Hostel-Residents
!
vlan 40
 name Guest-WiFi
!
vlan 99
 name Management
!
interface FastEthernet0/1
 switchport mode access
 switchport access vlan 30
 no switchport port-security
!
interface FastEthernet0/2
 switchport mode access
 switchport access vlan 30
 no switchport port-security
!
interface FastEthernet0/3
 switchport mode access
 switchport access vlan 30
!
interface FastEthernet0/4
 switchport mode access
 switchport access vlan 30
!
interface FastEthernet0/9
 switchport mode access
 switchport access vlan 40
!
interface FastEthernet0/10
 switchport mode access
 switchport access vlan 40
!
interface GigabitEthernet0/1
 switchport mode trunk
 switchport trunk allowed vlan 30,40,99
!
interface Vlan99
 ip address 10.10.2.10 255.255.255.0
 no shutdown
!
ip default-gateway 10.10.2.1
!
ntp server 10.10.0.2
!
snmp-server community public RO
snmp-server community hostel-mgmt RO
!
line con 0
 exec-timeout 5 0
line vty 0 4
 transport input telnet ssh
 exec-timeout 15 0
 login local
!
end
