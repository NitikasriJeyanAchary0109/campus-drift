!
! Simulated Cisco IOS / FRR Router Configuration
! Location: Research Computer Lab Router
!
version 15.4
service timestamps debug datetime msec
service timestamps log datetime msec
!
hostname rtr-lab-01
!
ip domain-name campus.internal
!
interface GigabitEthernet0/0
 description Uplink to Campus Backbone
 ip address 10.10.100.2 255.255.255.252
 duplex auto
 speed auto
 no shutdown
!
interface GigabitEthernet0/1
 description Research Lab Subnet
 ip address 10.10.4.1 255.255.255.0
 duplex auto
 speed auto
 no shutdown
!
router ospf 1
 router-id 10.10.100.2
 network 10.10.100.0 0.0.0.3 area 0
 network 10.10.4.0 0.0.0.255 area 0
!
ip route 0.0.0.0 0.0.0.0 10.10.100.1
!
ntp server 10.10.0.1
!
line vty 0 4
 transport input ssh
 login local
!
end
